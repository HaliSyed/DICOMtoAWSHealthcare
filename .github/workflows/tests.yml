name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install (pinned)
        run: python -m pip install -r requirements.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: End-to-end ingest and leak scan
        shell: bash
        run: |
          dicom-deid synth
          dicom-deid ingest
          python scripts/leak_scan.py | tee leak.txt
          grep -q "Leaks found: 0" leak.txt
